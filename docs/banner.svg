<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="whalegate — an OpenAI-compatible gateway into DeepSeek web">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#04101f"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#3a6ff0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cf3d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7cf3d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cf3d0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#sea)"/>

  <!-- waves -->
  <g fill="none" stroke="#1d3a66" stroke-width="2" opacity="0.8">
    <path d="M0 300 Q 75 285 150 300 T 300 300 T 450 300 T 600 300 T 750 300 T 900 300 T 1050 300 T 1200 300"/>
    <path d="M0 325 Q 75 310 150 325 T 300 325 T 450 325 T 600 325 T 750 325 T 900 325 T 1050 325 T 1200 325" opacity="0.6"/>
  </g>

  <!-- bubbles -->
  <g fill="#6aa8ff" opacity="0.35">
    <circle cx="130" cy="90" r="4"/><circle cx="160" cy="60" r="2.5"/><circle cx="1080" cy="110" r="3.5"/>
    <circle cx="1110" cy="80" r="2"/><circle cx="560" cy="40" r="2"/>
  </g>

  <!-- gate: two pillars + lintel -->
  <g>
    <rect x="160" y="110" width="22" height="170" rx="4" fill="#24406e"/>
    <rect x="338" y="110" width="22" height="170" rx="4" fill="#24406e"/>
    <rect x="146" y="96" width="228" height="20" rx="6" fill="#2e528c"/>
    <rect x="182" y="150" width="156" height="6" fill="url(#beam)"/>
    <rect x="182" y="190" width="156" height="6" fill="url(#beam)" opacity="0.7"/>
    <rect x="182" y="230" width="156" height="6" fill="url(#beam)" opacity="0.5"/>
  </g>

  <!-- whale swimming through the gate -->
  <g transform="translate(188 158) scale(0.8)">
    <path d="M10 70 C 20 20, 120 0, 180 40 C 205 56, 214 76, 208 96 C 200 118, 150 130, 90 124 C 40 118, 4 100, 10 70 Z" fill="url(#whale)"/>
    <path d="M200 60 C 225 30, 250 30, 262 18 C 258 44, 246 64, 222 74 C 244 80, 258 100, 264 124 C 246 110, 224 104, 204 96 Z" fill="#3a6ff0"/>
    <path d="M40 104 C 70 118, 130 122, 176 110" fill="none" stroke="#cfe0ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="52" cy="66" r="6" fill="#0b1a33"/>
    <circle cx="54" cy="64" r="2" fill="#ffffff"/>
    <path d="M70 30 C 66 10, 74 -6, 86 -14 M70 30 C 60 14, 48 6, 36 4" fill="none" stroke="#7cf3d0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="480" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff" letter-spacing="-1">whalegate</text>
  <text x="484" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a9c4ef">An OpenAI-compatible gateway into DeepSeek web</text>
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#7cf3d0">
    <rect x="484" y="238" width="274" height="34" rx="8" fill="#0f2747" stroke="#24406e"/>
    <text x="498" y="261">POST /v1/chat/completions</text>
    <rect x="770" y="238" width="122" height="34" rx="8" fill="#0f2747" stroke="#24406e"/>
    <text x="784" y="261">tool calls</text>
    <rect x="904" y="238" width="104" height="34" rx="8" fill="#0f2747" stroke="#24406e"/>
    <text x="918" y="261">acc pool</text>
    <rect x="1020" y="238" width="86" height="34" rx="8" fill="#0f2747" stroke="#24406e"/>
    <text x="1034" y="261">vision</text>
  </g>
</svg>
