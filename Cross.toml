# BoringSSL (wreq) cần cmake + clang/libclang (bindgen) khi build trong container của `cross`.
[target.x86_64-unknown-linux-musl]
pre-build = [
  "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake clang libclang-dev",
]

[target.aarch64-unknown-linux-musl]
pre-build = [
  "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake clang libclang-dev",
]
