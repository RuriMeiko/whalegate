name = "ds-proxy"
main = "ds-proxy.js"
compatibility_date = "2024-09-01"

# Set qua dashboard hoặc `wrangler secret put`:
#   UPSTREAMS    : ["https://ds-harness-1.example","https://ds-harness-2.example"]
#   WORKER_TOKEN : mật khẩu bearer client phải gửi

# Nếu có KV namespace (free tier 1 namespace OK):
# kv_namespaces = [
#   { binding = "ROBIN_KV", id = "<namespace_id>" }
# ]

[observability]
enabled = true
