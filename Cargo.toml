[package]
name = "whalegate"
version = "0.5.29"
edition = "2021"

[dependencies]
async-stream = "0.3"
# "cookies" không dùng: cookie truyền tay qua header (mỗi acc một bộ cookie riêng)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "multipart", "rustls-tls", "charset"] }
# Giả lập trình duyệt: TLS (BoringSSL như Chrome) + HTTP/2 + header đúng từng phiên bản, mỗi acc một profile
# "socks": proxy đầu ra socks5/socks5h (mỗi acc một IP khác) — xem src/proxypool.rs
wreq = { version = "6.0.0-rc.31", features = ["json", "multipart", "stream", "gzip", "brotli", "zstd", "deflate", "cookies", "socks"] }
wreq-util = "3.0.0-rc.14"
# Register acc không cần Chrome: mã hoá body auth (AES-128-CBC + RSA-OAEP-SHA256) như web 2.7.0
aes = "0.9"
cbc = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
# Chỉ bật feature thực dùng — "full" kéo cả signal/process/net-unix... làm build chậm
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
# Tự cập nhật: giải nén bản release tải từ GitHub (tar.gz cho unix, zip cho Windows)
flate2 = "1"
tar = "0.4"
# zip: giải nén bản release Windows, và đóng gói tiện ích trình duyệt cho dashboard tải về
zip = { version = "2", default-features = false, features = ["deflate"] }

# Deploy chạy target/release: PoW (Keccak) và parse DSML hưởng lợi trực tiếp từ LTO + 1 codegen unit.
# Không dùng panic=abort: một panic trong 1 request chỉ được giết task đó, không kéo sập cả proxy (mọi acc/phiên).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
