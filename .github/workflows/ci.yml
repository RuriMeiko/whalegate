# Test trên cả ba hệ: unit test + Chrome thật (mở, áp vân tay, tắt êm, mở lại profile) + test Worker.
# Không publish gì — release vẫn do release.yml lo khi đẩy tag.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # wreq nhúng BoringSSL: cần cmake + (trên Windows) NASM + LLVM/clang cho bindgen — giống release.yml
      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm cmake llvm -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Unit tests
        run: cargo test --locked

      # runner GitHub có sẵn Google Chrome. macOS/Windows có màn hình nên thử cả cửa sổ thật; Linux chỉ headless.
      - name: Real Chrome (launch, fingerprint, graceful close, reopen profile)
        shell: bash
        env:
          WG_TEST_HEADED: ${{ runner.os != 'Linux' && '1' || '0' }}
        run: cargo test --locked chrome_os_ -- --ignored --nocapture

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Worker tests
        run: node --test worker/ds-proxy.test.mjs
